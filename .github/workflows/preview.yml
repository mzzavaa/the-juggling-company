name: PR preview

# On every PR: build the site, run the Playwright smoke tests (each page loads,
# the map renders, no uncaught JS errors), capture desktop + mobile screenshots,
# attach them to the run, and post/update a sticky comment so changes can be
# reviewed from any device before merging.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build, smoke-test, screenshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # post the sticky preview comment
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Smoke tests + screenshots
        id: e2e
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-preview-screenshots
          path: preview-shots/
          if-no-files-found: warn

      - name: Post preview comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const ok = process.env.E2E_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 📸 PR preview & smoke tests',
              '',
              `**Smoke tests:** ${ok ? '✅ passed' : '❌ failed'} — 6 key pages × desktop + mobile (page loads, map renders, no uncaught JS errors).`,
              '',
              `**Screenshots:** desktop full-page + mobile views are attached to this run — open the **pr-preview-screenshots** artifact at the bottom of [the run summary](${runUrl}).`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
