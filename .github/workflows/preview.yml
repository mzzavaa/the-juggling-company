name: PR preview

# On every PR: build the site, run the Playwright smoke tests (each page loads,
# the map renders, no uncaught JS errors), capture desktop + mobile screenshots,
# attach them to the run, and post/update a sticky comment so changes can be
# reviewed from any device before merging.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build, smoke-test, screenshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # post the sticky preview comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      # System libs are best-effort: the ubuntu-24.04 runner already ships most
      # of them, and the apt step can flake on a transient mirror 403. Don't let
      # that fail the job - the smoke-test step surfaces any real launch problem.
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
        continue-on-error: true

      - name: Build site
        run: npm run build

      - name: Smoke tests + screenshots
        id: e2e
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-screenshots
          path: preview-shots/
          if-no-files-found: warn

      - name: Post preview comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const ok = process.env.E2E_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 📸 PR preview & smoke tests',
              '',
              `**Smoke tests:** ${ok ? '✅ passed' : '❌ failed'} — 6 key pages × desktop + mobile (page loads, map renders, no uncaught JS errors).`,
              '',
              `**Screenshots:** desktop full-page + mobile views are attached to this run — open the **pr-preview-screenshots** artifact at the bottom of [the run summary](${runUrl}).`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
