name: zizmor (workflow lint)

# Standalone PR check that runs zizmor on workflow changes + a weekly cron so
# new advisories surface even when no PR touches the workflows.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: medium
          advanced-security: false
