<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="currentColor">
  <!-- Woman Juggler Silhouette - Elegant pose with arms raised -->
  <defs>
    <linearGradient id="bodyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <ellipse cx="100" cy="45" rx="22" ry="26" fill="url(#bodyGlow)"/>
  
  <!-- Hair (flowing) -->
  <path d="M78 35 Q70 50 72 70 Q75 85 85 90 L82 75 Q80 55 85 40 Z" fill="url(#bodyGlow)" opacity="0.8"/>
  <path d="M122 35 Q130 50 128 70 Q125 85 115 90 L118 75 Q120 55 115 40 Z" fill="url(#bodyGlow)" opacity="0.8"/>
  
  <!-- Neck -->
  <path d="M92 68 L92 82 L108 82 L108 68" fill="url(#bodyGlow)"/>
  
  <!-- Torso (feminine shape) -->
  <path d="M85 82 
           Q75 95 78 115 
           Q80 135 85 150 
           L90 180 
           L110 180 
           L115 150 
           Q120 135 122 115 
           Q125 95 115 82 
           Z" fill="url(#bodyGlow)"/>
  
  <!-- Left arm (raised, juggling position) -->
  <path d="M78 90 
           Q55 85 45 65 
           Q40 55 35 50
           L38 45
           Q45 52 50 60
           Q60 75 75 85
           Z" fill="url(#bodyGlow)"/>
  <!-- Left hand -->
  <ellipse cx="36" cy="47" rx="8" ry="6" fill="url(#bodyGlow)"/>
  
  <!-- Right arm (raised, juggling position) -->
  <path d="M122 90 
           Q145 85 155 65 
           Q160 55 165 50
           L162 45
           Q155 52 150 60
           Q140 75 125 85
           Z" fill="url(#bodyGlow)"/>
  <!-- Right hand -->
  <ellipse cx="164" cy="47" rx="8" ry="6" fill="url(#bodyGlow)"/>
  
  <!-- Skirt/Dress (flowing) -->
  <path d="M85 175 
           Q70 200 60 250 
           Q55 275 50 295
           L70 295
           Q75 270 85 245
           L100 220
           L115 245
           Q125 270 130 295
           L150 295
           Q145 275 140 250
           Q130 200 115 175
           Z" fill="url(#bodyGlow)"/>
  
  <!-- Left leg hint -->
  <path d="M75 290 L75 298 L85 298 L85 290" fill="url(#bodyGlow)"/>
  
  <!-- Right leg hint -->
  <path d="M115 290 L115 298 L125 298 L125 290" fill="url(#bodyGlow)"/>
</svg>
