# lychee link checker config — runs against built dist/ in CI.
max_redirects = 5
max_concurrency = 16
timeout = 20
retry_wait_time = 2
accept = ["200..=299", "403", "429"]
exclude_path = ["dist/_astro"]
exclude = [
  # Social embed providers commonly rate-limit headless link checkers.
  "^https?://(www\\.)?(twitter|x|instagram|tiktok|facebook|linkedin)\\.com",
  # YouTube embed URLs return non-200 to non-browser UAs.
  "^https?://(www\\.)?youtube\\.com/embed/",
  # localhost / placeholders
  "^https?://(localhost|127\\.0\\.0\\.1)",
]
